name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0" "platform-tools" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Environment and Keystore
        run: |
          echo "GEMINI_API_KEY=" > .env
          echo "GEMINI_API_KEY=" > .env.example
          
          # Generar debug.keystore válido
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Locate and Collect APK
        run: |
          mkdir -p apk_output
          find . -name "*debug*.apk" -exec cp {} apk_output/ \;
          ls -la apk_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MC-Flashcards-Debug-APK
          path: apk_output/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "MC Flashcards APK - Descarga Directa"
          body: "Descarga e instala el archivo .apk directamente en tu teléfono Android."
          files: apk_output/*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
